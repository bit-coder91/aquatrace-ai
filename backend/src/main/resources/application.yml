server:
  port: ${PORT:8081}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: aquatrace-api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

firebase:
  project-id: ${FIREBASE_PROJECT_ID:demo-aquatrace-local}
  storage-bucket: ${FIREBASE_STORAGE_BUCKET:${FIREBASE_PROJECT_ID:demo-aquatrace-local}.firebasestorage.app}
  emulator-mode: ${FIREBASE_EMULATOR_MODE:false}

aquatrace:
  cors:
    allowed-origins: ${AQUATRACE_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  firestore:
    operation-timeout-seconds: ${AQUATRACE_FIRESTORE_TIMEOUT_SECONDS:4}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.aquatrace: INFO
