[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aquatrace-data-pipeline"
version = "0.1.0"
description = "Validation, time-series transformations, and analytics for AquaTrace meter data"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "numpy>=1.26,<3", "firebase-admin==7.7.0", "google-cloud-storage>=2.19,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
aquatrace-pipeline = "aquatrace_pipeline.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
